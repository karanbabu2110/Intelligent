# KAOS local-development SearXNG configuration.
# The official image defaults supply engines and other provider policy.
use_default_settings:
  engines:
    keep_only:
      - google
      - bing
      - duckduckgo
      - brave

general:
  instance_name: "KAOS Local Search"

search:
  formats:
    - html
    - json

engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false

server:
  limiter: false
  public_instance: false
  image_proxy: false
